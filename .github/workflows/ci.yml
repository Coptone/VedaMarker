name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/VedaMarker.Core.Tests/VedaMarker.Core.Tests.csproj -c Release
      - run: dotnet test tests/VedaMarker.Capture.Tests/VedaMarker.Capture.Tests.csproj -c Release
